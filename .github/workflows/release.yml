name: Release

# Releases only from a tag pushed by hand, such as v0.5.1-letterboxd. This
# fork's versions carry the -letterboxd suffix, and the tag must match
# the version in manifest.json exactly; there is no automatic version bump.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sign the binaries with a build provenance attestation.
      id-token: write
      attestations: write
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check the tag against manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r '.version' manifest.json)"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}."
            exit 1
          fi

      - name: Build every platform
        run: make build-all

      - name: Write checksums
        run: (cd dist && sha256sum plugin-* > checksums.txt)

      # Silo checks a third-party release's bundle against the catalog's
      # repo_url and the tag refs/tags/v<version>.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Add the signature bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -e '.mediaType' "$BUNDLE_PATH" >/dev/null
          cp "$BUNDLE_PATH" dist/plugin.sigstore.json

      - name: Write the install index
        run: |
          go run ./cmd/genindex -repo "$GITHUB_REPOSITORY" -tag "$GITHUB_REF_NAME" \
            -dist dist -out dist/index.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/plugin-* dist/checksums.txt \
            dist/plugin.sigstore.json dist/index.json \
            --verify-tag --title "MDBList Ratings ${GITHUB_REF_NAME#v}" --generate-notes

  install-index:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Publish the released index on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          current="$(jq -r '.version' manifest.json)"
          if [ "$current" != "$version" ]; then
            echo "::notice::main has moved to version ${current}; the ${GITHUB_REF_NAME} index stays on the release."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern index.json --dir "$RUNNER_TEMP/index"
          cp "$RUNNER_TEMP/index/index.json" index.json
          git add index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish install index for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
